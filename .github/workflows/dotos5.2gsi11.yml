name: dotOS 11 GSI Builder

on:
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: 'Choose GSI variant to build:'
        required: true
        default: '64B'
        type: choice
        options:
          - '32B'
          - '32BO'
          - 'A64B'
          - 'A64BG'
          - 'A64BO'
          - '64B'
          - '64BG'
          - 'all'
      CLEAN_BUILD:
        description: 'Force clean build? (Avoid unless necessary)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  Start-Runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Configure the 'crave' environment
        run: |
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            mkdir ${HOME}/bin/
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          if tmux has-session -t ghactionsokbuddy; then 
            echo 'Runner is already Running' 
          else 
            tmux kill-session -t ghactionsokbuddy 2>/dev/null || true
            tmux new-session -d -s ghactionsokbuddy 
            tmux send-keys -t ghactionsokbuddy './actions-runner-okbuddy/run.sh' Enter 
            echo 'Runner Started'
          fi
          "

  build:
    name: Build dotOS 11 GSI
    needs: Start-Runner
    timeout-minutes: 1440
    runs-on: self-hosted
    concurrency:
      group: ${{ github.actor }}
    
    steps:
      - name: Display Build Info
        run: |
          echo "::group::Build Configuration"
          echo "Build Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          echo "Clean Build: ${{ github.event.inputs.CLEAN_BUILD }}"
          echo "ROM: dotOS 11 (Android 11)"
          echo "Strategy: Phhusson treble manifest + manual lunch/make + TouchInputMapper.cpp fix"
          echo "::endgroup::"

      - name: Telegram Notification - Build Started
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: "Build Started - dotOS 11 GSI - Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          skipSuccess: false

      - name: Cleanup Workspace
        run: |
          find . -maxdepth 1 -type f -delete 2>/dev/null || true
          find . -maxdepth 1 -type l -delete 2>/dev/null || true

      - name: Setup Project Directory
        run: |
          PROJECTFOLDER="/crave-devspaces/DotOS11"
          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_ENV"
          
          if [ "${DCDEVSPACE}" != "1" ]; then
            echo "Symlinking devspace folder"
            mkdir -p devspace
            sudo mkdir -p /crave-devspaces
            sudo ln -sf ${PWD}/devspace /crave-devspaces
            sudo chmod 777 /crave-devspaces
          else
            echo "We are already running in devspace... Skipping Symlinks"
          fi
          
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            echo "Destroying existing clone..."
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          fi

          if [ "${DCDEVSPACE}" == "1" ]; then
            crave clone create --projectID 85 $PROJECTFOLDER || echo "Crave clone create failed!"
          else
            mkdir -p $PROJECTFOLDER
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure Crave Environment
        run: |
          cd $PROJECTFOLDER
          mkdir -p .repo/manifests
          
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
            cp crave.conf ./
          fi
          
          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then
            cp ${GITHUB_WORKSPACE}/configs/crave/crave.yaml.aosp .repo/manifests/crave.yaml 2>/dev/null || echo "No template found, using default"
            echo "No Custom Configuration Found, Using Template!"
          else
            echo "${{ secrets.CUSTOM_YAML }}" > .repo/manifests/crave.yaml
            echo "Custom Configuration Found!"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Build dotOS 11 GSI
        run: |
          cd $PROJECTFOLDER
          
          jq '.projects = []' ~/crave.conf > tmp && mv tmp ~/crave.conf
          
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.CLEAN_BUILD }}" == "yes" ]; then
            CLEAN_FLAG="--clean"
          fi

          if [ "${{ github.event.inputs.BUILD_VARIANT }}" == "all" ]; then
            BUILD_TARGETS="32B 32BO A64B A64BG A64BO 64B 64BG"
          else
            BUILD_TARGETS="${{ github.event.inputs.BUILD_VARIANT }}"
          fi

          crave run --no-patch $CLEAN_FLAG "
          set -eE
          trap 'echo \"ERROR: Build failed at line \$LINENO\"' ERR

          echo '============================================'
          echo 'dotOS 11 Treble Buildbot'
          echo 'Strategy: Phhusson treble manifest + TouchInputMapper.cpp fix'
          echo 'Building variant(s): ${BUILD_TARGETS}'
          echo '============================================'
          echo ''

          echo '>>> Installing real libncurses5 and libtinfo5 (Ubuntu 20.04 binaries)...'
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq wget curl 2>/dev/null || true

          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb -O /tmp/libtinfo5.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb -O /tmp/libncurses5.deb

          sudo dpkg --force-depends -i /tmp/libtinfo5.deb /tmp/libncurses5.deb 2>/dev/null || {
            echo 'dpkg failed, extracting manually...'
            dpkg-deb -x /tmp/libtinfo5.deb /tmp/libtinfo5_extract
            dpkg-deb -x /tmp/libncurses5.deb /tmp/libncurses5_extract
            sudo cp /tmp/libtinfo5_extract/usr/lib/x86_64-linux-gnu/libtinfo.so.5* /usr/lib/x86_64-linux-gnu/
            sudo cp /tmp/libtinfo5_extract/lib/x86_64-linux-gnu/libtinfo.so.5* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
            sudo cp /tmp/libncurses5_extract/usr/lib/x86_64-linux-gnu/libncurses.so.5* /usr/lib/x86_64-linux-gnu/
            sudo cp /tmp/libncurses5_extract/lib/x86_64-linux-gnu/libncurses.so.5* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
          }

          if [ -f /usr/lib/x86_64-linux-gnu/libncurses.so.5 ]; then
            echo 'libncurses.so.5 installed successfully'
          else
            echo 'ERROR: libncurses.so.5 still missing!'
          fi

          rm -f /tmp/libtinfo5.deb /tmp/libncurses5.deb
          echo 'Dependency fix complete'

          echo ''
          echo '>>> Initializing dotOS 11 repository...'
          repo init -u git://github.com/DotOS/manifest.git -b dot11 --depth=1

          echo '>>> Adding Phhusson treble manifest...'
          mkdir -p .repo/local_manifests
          rm -rf .repo/local_manifests/phhusson_treble 2>/dev/null || true
          git clone --depth=1 --single-branch https://github.com/phhusson/treble_manifest.git -b android-11.0 .repo/local_manifests/phhusson_treble

          echo '>>> Syncing dotOS source...'
          repo sync -c -j\$(nproc --all) --force-sync --no-clone-bundle --no-tags

          echo '>>> Downloading TouchInputMapper.cpp...'
          mkdir -p frameworks/native/services/inputflinger/reader/mapper/
          TOUCH_FILE='frameworks/native/services/inputflinger/reader/mapper/TouchInputMapper.cpp'
          TOUCH_URL='https://github.com/amaxsky/android-11.0.0_r48/raw/refs/heads/main/TouchInputMapper.cpp'
          rm -f \$TOUCH_FILE
          curl -fL --retry 3 --retry-delay 3 -o \$TOUCH_FILE \$TOUCH_URL || true
          if [ -s \$TOUCH_FILE ] && grep -qE 'TouchInputMapper|#include' \$TOUCH_FILE; then
            echo \"TouchInputMapper.cpp replaced (\$(wc -l < \$TOUCH_FILE) lines)\"
          else
            echo 'WARNING: TouchInputMapper.cpp download failed, trying git clone fallback...'
            rm -f \$TOUCH_FILE
            TMP_DIR=\$(mktemp -d)
            git clone --depth=1 https://github.com/amaxsky/android-11.0.0_r48.git \$TMP_DIR/r48 2>/dev/null && \
              cp \$TMP_DIR/r48/TouchInputMapper.cpp \$TOUCH_FILE || echo 'ERROR: fallback failed'
            rm -rf \$TMP_DIR
          fi

          echo '>>> Generating treble device makefiles...'
          if [ -d device/phh/treble ]; then
            cd device/phh/treble
            git clean -fdx 2>/dev/null || true
            GEN_OK=0
            for mk in \
              ../../../vendor/dotos/config/common_full_phone.mk \
              ../../../vendor/dotos/config/common.mk \
              ../../../vendor/dotos/config/common_full.mk \
              ../../../vendor/dotos/config/phone.mk
            do
              if [ -f \"\$mk\" ]; then
                echo \"Using product mk: \$mk\"
                if bash generate.sh \"\$mk\"; then
                  GEN_OK=1
                  break
                fi
              fi
            done
            if [ \"\$GEN_OK\" -eq 0 ]; then
              echo 'WARNING: No dotOS product mk found, trying AOSP fallback...'
              if bash generate.sh ../../../build/target/product/gsi_release.mk 2>/dev/null; then
                GEN_OK=1
              fi
            fi
            if [ \"\$GEN_OK\" -eq 0 ]; then
              echo 'ERROR: generate.sh failed. dotOS may not support GSI build.'
              exit 1
            fi
            echo '>>> Generated makefiles:'
            ls treble_*.mk 2>/dev/null | head -10 || echo 'WARNING: No treble_*.mk generated!'
            cd ../../..
          else
            echo 'ERROR: device/phh/treble not found. dotOS may not support GSI build.'
            exit 1
          fi

          echo ''
          echo '>>> Listing all available lunch targets...'
          source build/envsetup.sh &> /dev/null
          echo '--- lunch targets containing treble/gsi/dot ---'
          lunch 2>/dev/null | grep -iE 'treble|gsi|dot' || echo '(no matching targets found)'
          echo '--- full lunch list (first 100 lines) ---'
          lunch 2>/dev/null | head -100 || echo '(lunch listing failed)'
          echo '--- end of lunch list ---'
          echo ''

          export BUILD_USERNAME=github
          export BUILD_HOSTNAME=azure

          mkdir -p ~/build-output

          build_variant() {
            case \"\${1}\" in
              (\"32B\")  TARGET=arm_bvS ;;
              (\"32BO\") TARGET=arm_boS ;;
              (\"A64B\") TARGET=a64_bvS ;;
              (\"A64BG\") TARGET=a64_bgS ;;
              (\"A64BO\") TARGET=a64_boS ;;
              (\"64B\")  TARGET=arm64_bvS ;;
              (\"64BG\") TARGET=arm64_bgS ;;
              (*) echo \"Invalid target: \${1}\"; return 1 ;;
            esac
            echo \"Building variant \${1} -> lunch treble_\${TARGET}-userdebug\"
            source build/envsetup.sh &> /dev/null
            lunch treble_\${TARGET}-userdebug || {
              echo \"ERROR: lunch failed for \${TARGET}\"
              return 1
            }
            make installclean
            make -j\$(nproc --all) systemimage || return 1
            make vndk-test-sepolicy || true
            if [ -f \$OUT/system.img ]; then
              cp \$OUT/system.img ~/build-output/dotos-11-\$(date +%Y%m%d)-GSI-\${1}.img
              echo \"Produced: ~/build-output/dotos-11-\$(date +%Y%m%d)-GSI-\${1}.img\"
            else
              echo \"ERROR: \$OUT/system.img not found\"
              return 1
            fi
            return 0
          }

          FAILED=0
          for variant in ${BUILD_TARGETS}; do
            echo \"\"
            echo '============================================'
            echo \"Building variant: \${variant}\"
            echo '============================================'
            build_variant \${variant} || { echo \"Variant \${variant} FAILED\"; FAILED=1; }
          done

          echo ''
          echo '============================================'
          echo '>>> Checking for generated images...'
          echo '============================================'
          if ls ~/build-output/dotos-*.img 2>/dev/null; then
            IMG_COUNT=\$(ls ~/build-output/dotos-*.img 2>/dev/null | wc -l)
            echo \"Found \${IMG_COUNT} GSI image(s)\"
            for img in ~/build-output/dotos-*.img; do
              echo \"  \$(basename \$img) - \$(du -h \$img | cut -f1)\"
            done
            mkdir -p out/target/product/64B/
            cp ~/build-output/dotos-*.img out/target/product/64B/ 2>/dev/null || true
            echo 'Images copied to out/target/product/64B/'
          else
            echo 'WARNING: No GSI images found in ~/build-output/'
            ls -la ~/build-output/ 2>/dev/null || echo '(directory empty or missing)'
            FAILED=1
          fi

          echo ''
          echo '============================================'
          echo 'Build completed. Failed=\$FAILED'
          echo '============================================'
          exit \$FAILED
          "
        timeout-minutes: 1440

      - name: Copy artifacts to out/target/product/64B/ for upload
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          crave ssh -- "
          if ls ~/build-output/dotos-*.img 2>/dev/null; then
            mkdir -p /tmp/src/android/out/target/product/64B/
            cp ~/build-output/dotos-*.img /tmp/src/android/out/target/product/64B/ 2>/dev/null || true
            echo 'Artifacts copied to out/target/product/64B/'
            ls -la /tmp/src/android/out/target/product/64B/dotos-*
          else
            echo 'No artifacts found in ~/build-output/'
          fi
          "

      - name: Telegram Notification - Build Status
        if: ${{ success() || cancelled() || failure() }}
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: ${{ job.status }}
          skipSuccess: false

      - name: Stop Build if Cancelled
        if: ${{ cancelled() }}
        run: |
          cd $PROJECTFOLDER
          crave stop --all

      - name: Upload Build Artifacts to GitHub
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          echo "${{ secrets.GITHUB_TOKEN }}" > token.txt
          crave push token.txt -d $(crave ssh -- pwd | grep -v Select | sed -s 's/\r//g')/
          crave ssh -- "export GH_UPLOAD_LIMIT="${{ secrets.GH_UPLOAD_LIMIT }}"; bash /opt/crave/github-actions/upload.sh '${{ github.run_id }}' '64B' '${{ github.repository }}' 'dotOS11-${{ github.run_id }}' '${{ secrets.EXTRA_FILES }}'"

      - name: Display Error Log if Build Failed
        if: ${{ failure() }}
        run: |
          cd $PROJECTFOLDER
          crave ssh -- sleep 1
          crave pull out/error.log 2>/dev/null || echo "No error.log found"
          if [ -f out/error.log ]; then
            echo "::group::Build Error Log"
            cat out/error.log
            echo "::endgroup::"
          fi

      - name: Upload to Telegram
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          NOW=$(date '+%Y%m%d')
          crave ssh -- "export TG_UPLOAD_LIMIT="${{ secrets.TG_UPLOAD_LIMIT }}"; bash /opt/crave/telegram/upload.sh 'dotOS 11 GSI $NOW' '${{ secrets.EXTRA_FILES }}'"

      - name: Clean Up Crave Clone
        if: ${{ always() }}
        run: |
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          else
            if [ -d "$PROJECTFOLDER" ]; then
              rm -rf $PROJECTFOLDER
            fi
          fi
