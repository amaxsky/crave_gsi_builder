name: LineageOS 16.0 GSI Builder

on:
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: 'Choose GSI variant to build:'
        required: true
        default: 'arm64_bvN'
        type: choice
        options:
          - 'arm_avN'
          - 'arm_bvN'
          - 'a64_avN'
          - 'a64_bvN'
          - 'arm64_avN'
          - 'arm64_bvN'
          - 'all'
      CLEAN_BUILD:
        description: 'Force clean build? (Avoid unless necessary)'
        required: true
        default: 'no'
        type: choice
        options: 
          - 'no'
          - 'yes'

jobs:
  Start-Runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Configure the 'crave' environment
        run: |
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            mkdir ${HOME}/bin/
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          if tmux has-session -t ghactionsokbuddy; then 
            echo 'Runner is already Running' 
          else 
            tmux kill-session -t ghactionsokbuddy 2>/dev/null || true
            tmux new-session -d -s ghactionsokbuddy 
            tmux send-keys -t ghactionsokbuddy './actions-runner-okbuddy/run.sh' Enter 
            echo 'Runner Started'
          fi
          "

  build:
    name: Build LineageOS 16.0 GSI
    needs: Start-Runner
    timeout-minutes: 1440
    runs-on: self-hosted
    concurrency:
      group: ${{ github.actor }}
    
    steps:
      - name: Display Build Info
        run: |
          echo "::group::Build Configuration"
          echo "Build Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          echo "Clean Build: ${{ github.event.inputs.CLEAN_BUILD }}"
          echo "::endgroup::"

      - name: Telegram Notification - Build Started
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: "Build Started - LineageOS 16.0 GSI - Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          skipSuccess: false

      - name: Cleanup Workspace
        run: |
          find . -maxdepth 1 -type f -delete 2>/dev/null || true
          find . -maxdepth 1 -type l -delete 2>/dev/null || true

      - name: Setup Project Directory
        run: |
          PROJECTFOLDER="/crave-devspaces/Lineage16"
          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_ENV"
          
          if [ "${DCDEVSPACE}" != "1" ]; then
            echo "Symlinking devspace folder"
            mkdir -p devspace
            sudo mkdir -p /crave-devspaces
            sudo ln -sf ${PWD}/devspace /crave-devspaces
            sudo chmod 777 /crave-devspaces
          else
            echo "We are already running in devspace... Skipping Symlinks"
          fi
          
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            echo "Destroying existing clone..."
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          fi

          if [ "${DCDEVSPACE}" == "1" ]; then
            crave clone create --projectID 81 $PROJECTFOLDER || echo "Crave clone create failed!"
          else
            mkdir -p $PROJECTFOLDER
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure Crave Environment
        run: |
          cd $PROJECTFOLDER
          mkdir -p .repo/manifests
          
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
            cp crave.conf ./
          fi
          
          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then
            cp ${GITHUB_WORKSPACE}/configs/crave/crave.yaml.aosp .repo/manifests/crave.yaml 2>/dev/null || echo "No template found, using default"
            echo "No Custom Configuration Found, Using Template!"
          else
            echo "${{ secrets.CUSTOM_YAML }}" > .repo/manifests/crave.yaml
            echo "Custom Configuration Found!"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Build LineageOS 16.0 GSI
        run: |
          cd $PROJECTFOLDER
          
          jq '.projects = []' ~/crave.conf > tmp && mv tmp ~/crave.conf
          
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.CLEAN_BUILD }}" == "yes" ]; then
            CLEAN_FLAG="--clean"
          fi

          crave run --no-patch $CLEAN_FLAG "
          echo '============================================'
          echo 'PHH-based LineageOS 16.0 GSI Build'
          echo 'Following AndyCGYan official build guide'
          echo 'Building variant: ${{ github.event.inputs.BUILD_VARIANT }}'
          echo '============================================'
          echo ''

          START=\$(date +%s)

          echo '>>> Cloning treble_experimentations to home directory...'
          rm -rf ~/treble_experimentations 2>/dev/null || true
          git clone https://github.com/AndyCGYan/treble_experimentations ~/treble_experimentations

          echo ''
          echo '>>> Initializing LineageOS 16.0 workspace...'
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --git-lfs

          echo ''
          echo '>>> Cloning treble_patches (lineage-16.0 branch)...'
          rm -rf treble_patches 2>/dev/null || true
          git clone https://github.com/AndyCGYan/treble_patches treble_patches -b lineage-16.0

          echo '>>> Cloning treble_build_los (lineage-16.0 branch)...'
          rm -rf treble_build_los 2>/dev/null || true
          git clone https://github.com/AndyCGYan/treble_build_los treble_build_los -b lineage-16.0

          echo ''
          echo '>>> Downloading custom buildbot_treble.sh from amaxsky/los16.0gsi...'
          wget -q -O treble_build_los/buildbot_treble.sh https://github.com/amaxsky/los16.0gsi/raw/refs/heads/main/buildbot_treble.sh
          
          if [ -s treble_build_los/buildbot_treble.sh ]; then
            echo 'buildbot_treble.sh downloaded and replaced successfully'
            chmod +x treble_build_los/buildbot_treble.sh
          else
            echo 'WARNING: buildbot_treble.sh download failed, using upstream version'
          fi

          echo ''
          echo '>>> Verifying build script...'
          ls -la treble_build_los/buildbot_treble.sh
          echo '--- First 10 lines: ---'
          head -10 treble_build_los/buildbot_treble.sh
          echo '--- Checking for InputReader.cpp replacement logic: ---'
          grep -n 'InputReader' treble_build_los/buildbot_treble.sh || echo '(no InputReader reference found)'
          echo ''

          export BUILD_USERNAME=azure
          export BUILD_HOSTNAME=github

          echo '>>> Running build script: bash treble_build_los/buildbot_treble.sh'
          echo ''
          bash treble_build_los/buildbot_treble.sh
          BUILD_EXIT_CODE=\$?

          echo ''
          echo '============================================'
          echo '>>> Checking for generated images...'
          echo '============================================'
          if ls ~/build-output/lineage-*.img 2>/dev/null; then
            IMG_COUNT=\$(ls ~/build-output/lineage-*.img 2>/dev/null | wc -l)
            echo \"Found \${IMG_COUNT} GSI image(s)\"
            for img in ~/build-output/lineage-*.img; do
              echo \"  \$(basename \$img) - \$(du -h \$img | cut -f1)\"
            done
            echo ''
            echo '>>> Copying images for upload...'
            mkdir -p out/target/product/arm64_bvN/
            cp ~/build-output/lineage-*.img out/target/product/arm64_bvN/ 2>/dev/null || true
            cp ~/build-output/lineage-*.zip out/target/product/arm64_bvN/ 2>/dev/null || true
            echo 'Images copied successfully'
          else
            echo 'WARNING: No GSI images found in ~/build-output/'
            echo 'Contents of ~/build-output/:'
            ls -la ~/build-output/ 2>/dev/null || echo '(directory empty or missing)'
          fi

          END=\$(date +%s)
          ELAPSEDM=\$(((\$END-\$START)/60))
          ELAPSEDS=\$(((\$END-\$START)-\$ELAPSEDM*60))
          echo ''
          echo '============================================'
          echo \"Build completed in \$ELAPSEDM minutes and \$ELAPSEDS seconds\"
          echo 'Exit code: '\$BUILD_EXIT_CODE
          echo '============================================'
          exit \$BUILD_EXIT_CODE
          "
        timeout-minutes: 1440

      - name: Telegram Notification - Build Status
        if: ${{ success() || cancelled() || failure() }}
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: ${{ job.status }}
          skipSuccess: false

      - name: Stop Build if Cancelled
        if: ${{ cancelled() }}
        run: |
          cd $PROJECTFOLDER
          crave stop --all

      - name: Upload Build Artifacts to GitHub
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          echo "${{ secrets.GITHUB_TOKEN }}" > token.txt
          crave push token.txt -d $(crave ssh -- pwd | grep -v Select | sed -s 's/\r//g')/
          crave ssh -- "export GH_UPLOAD_LIMIT="${{ secrets.GH_UPLOAD_LIMIT }}"; bash /opt/crave/github-actions/upload.sh '${{ github.run_id }}' 'arm64_bvN' '${{ github.repository }}' 'LineageOS16.0-${{ github.run_id }}' '${{ secrets.EXTRA_FILES }}'"

      - name: Display Error Log if Build Failed
        if: ${{ failure() }}
        run: |
          cd $PROJECTFOLDER
          crave ssh -- sleep 1
          crave pull out/error.log 2>/dev/null || echo "No error.log found"
          if [ -f out/error.log ]; then
            echo "::group::Build Error Log"
            cat out/error.log
            echo "::endgroup::"
          fi

      - name: Upload to Telegram
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          NOW=$(date '+%Y%m%d')
          crave ssh -- "export TG_UPLOAD_LIMIT="${{ secrets.TG_UPLOAD_LIMIT }}"; bash /opt/crave/telegram/upload.sh 'LineageOS 16.0 GSI $NOW' '${{ secrets.EXTRA_FILES }}'"

      - name: Clean Up Crave Clone
        if: ${{ always() }}
        run: |
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          else
            if [ -d "$PROJECTFOLDER" ]; then
              rm -rf $PROJECTFOLDER
            fi
          fi
