name: LineageOS 16.0 GSI Builder

on:
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: 'Choose GSI variant to build:'
        required: true
        default: 'treble_arm64_bvN'
        type: choice
        options:
          - 'treble_arm_avN'
          - 'treble_arm_bvN'
          - 'treble_a64_avN'
          - 'treble_a64_bvN'
          - 'treble_arm64_avN'
          - 'treble_arm64_bvN'
          - 'all'
      CLEAN_BUILD:
        description: 'Force clean build? (Avoid unless necessary)'
        required: true
        default: 'no'
        type: choice
        options: 
          - 'no'
          - 'yes'

jobs:
  Start-Runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Configure the 'crave' environment
        run: |
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            mkdir ${HOME}/bin/
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          if tmux has-session -t ghactionsokbuddy; then 
            echo 'Runner is already Running' 
          else 
            tmux kill-session -t ghactionsokbuddy 2>/dev/null || true
            tmux new-session -d -s ghactionsokbuddy 
            tmux send-keys -t ghactionsokbuddy './actions-runner-okbuddy/run.sh' Enter 
            echo 'Runner Started'
          fi
          "

  build:
    name: Build LineageOS 16.0 GSI
    needs: Start-Runner
    timeout-minutes: 1440
    runs-on: self-hosted
    concurrency:
      group: ${{ github.actor }}
    
    steps:
      - name: Display Build Info
        run: |
          echo "::group::Build Configuration"
          echo "Build Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          echo "Clean Build: ${{ github.event.inputs.CLEAN_BUILD }}"
          echo "::endgroup::"

      - name: Telegram Notification - Build Started
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: "Build Started - LineageOS 16.0 GSI - Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          skipSuccess: false

      - name: Cleanup Workspace
        run: |
          find . -maxdepth 1 -type f -delete 2>/dev/null || true
          find . -maxdepth 1 -type l -delete 2>/dev/null || true

      - name: Setup Project Directory
        run: |
          PROJECTFOLDER="/crave-devspaces/Lineage16"
          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_ENV"
          
          if [ "${DCDEVSPACE}" != "1" ]; then
            echo "Symlinking devspace folder"
            mkdir -p devspace
            sudo mkdir -p /crave-devspaces
            sudo ln -sf ${PWD}/devspace /crave-devspaces
            sudo chmod 777 /crave-devspaces
          else
            echo "We are already running in devspace... Skipping Symlinks"
          fi
          
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            echo "Destroying existing clone..."
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          fi

          if [ "${DCDEVSPACE}" == "1" ]; then
            crave clone create --projectID 81 $PROJECTFOLDER || echo "Crave clone create failed!"
          else
            mkdir -p $PROJECTFOLDER
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure Crave Environment
        run: |
          cd $PROJECTFOLDER
          mkdir -p .repo/manifests
          
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
            cp crave.conf ./
          fi
          
          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then
            cp ${GITHUB_WORKSPACE}/configs/crave/crave.yaml.aosp .repo/manifests/crave.yaml 2>/dev/null || echo "No template found, using default"
            echo "No Custom Configuration Found, Using Template!"
          else
            echo "${{ secrets.CUSTOM_YAML }}" > .repo/manifests/crave.yaml
            echo "Custom Configuration Found!"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Build LineageOS 16.0 GSI
        run: |
          cd $PROJECTFOLDER
          
          jq '.projects = []' ~/crave.conf > tmp && mv tmp ~/crave.conf
          
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.CLEAN_BUILD }}" == "yes" ]; then
            CLEAN_FLAG="--clean"
          fi

          crave run --no-patch $CLEAN_FLAG "
          set -e
          
          echo '============================================'
          echo 'LineageOS 16.x Treble Buildbot'
          echo 'Running via crave run - fully compliant'
          echo 'Building variant: ${{ github.event.inputs.BUILD_VARIANT }}'
          echo '============================================'
          echo ''
          
          START=\$(date +%s)
          BUILD_DATE=\"\$(date +%Y%m%d)\"
          
          echo '>>> Cloning treble_experimentations...'
          rm -rf ~/treble_experimentations
          git clone https://github.com/AndyCGYan/treble_experimentations ~/treble_experimentations
          
          echo '>>> Cloning treble_patches...'
          rm -rf treble_patches
          git clone https://github.com/AndyCGYan/treble_patches -b lineage-16.0
          
          echo '>>> Cloning treble_build_los...'
          rm -rf treble_build_los
          git clone https://github.com/AndyCGYan/treble_build_los -b lineage-16.0
          BL=\$PWD/treble_build_los
          
          echo ''
          echo '>>> Preparing local manifest...'
          mkdir -p .repo/local_manifests
          cp \$BL/manifest.xml .repo/local_manifests/manifest.xml
          
          echo '>>> Initializing repository (if needed)...'
          if [ ! -d .repo ]; then
            repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth 1
          fi
          
          echo ''
          echo '>>> Syncing repos...'
          repo sync -c --force-sync --no-clone-bundle --no-tags -j\$(nproc --all)
          
          echo ''
          echo '>>> Setting up build environment...'
          source build/envsetup.sh &> /dev/null
          
          echo '>>> Applying PHH patches...'
          cd frameworks/base
          git am \$BL/patches/0001-Squashed-revert-of-LOS-FOD-implementation.patch || true
          cd ../..
          rm -f device/*/sepolicy/common/private/genfs_contexts
          cd device/phh/treble
          git clean -fdx
          bash generate.sh lineage
          cd ../../..
          bash ~/treble_experimentations/apply-patches.sh treble_patches/patches || true
          
          echo '>>> Applying universal patches...'
          cd frameworks/base
          git am \$BL/patches/0001-Disable-vendor-mismatch-warning.patch || true
          git am \$BL/patches/0001-Keyguard-Show-shortcuts-by-default.patch || true
          git am \$BL/patches/0001-core-Add-support-for-MicroG.patch || true
          cd ../..
          cd lineage-sdk
          git am \$BL/patches/0001-sdk-Invert-per-app-stretch-to-fullscreen.patch || true
          cd ..
          cd packages/apps/LineageParts
          git am \$BL/patches/0001-LineageParts-Invert-per-app-stretch-to-fullscreen.patch || true
          cd ../../..
          cd vendor/lineage
          git am \$BL/patches/0001-vendor_lineage-Log-privapp-permissions-whitelist-vio.patch || true
          cd ../..
          
          echo '>>> Applying GSI-specific patches...'
          cd build/make
          git am \$BL/patches/0001-Revert-Enable-dyanmic-image-size-for-GSI.patch || true
          cd ../..
          cd device/phh/treble
          git revert 82b15278bad816632dcaeaed623b569978e9840d --no-edit || true
          git am \$BL/patches/0001-Remove-fsck-SELinux-labels.patch || true
          git am \$BL/patches/0001-treble-Add-overlay-lineage.patch || true
          git am \$BL/patches/0001-treble-Don-t-specify-config_wallpaperCropperPackage.patch || true
          git am \$BL/patches/0001-Increase-system-partition-size-for-arm_ab.patch || true
          cd ../../..
          cd external/tinycompress
          git revert fbe2bd5c3d670234c3c92f875986acc148e6d792 --no-edit || true
          cd ../..
          cd vendor/interfaces
          git revert 0611b67d96f7f7f71b12079a1b345022fe7bd323 --no-edit || true
          cd ../..
          cd vendor/lineage
          git am \$BL/patches/0001-build_soong-Disable-generated_kernel_headers.patch || true
          cd ../..
          cd vendor/qcom/opensource/cryptfs_hw
          git revert 6a3fc11bcc95d1abebb60e5d714adf75ece83102 --no-edit || true
          git am \$BL/patches/0001-Header-hack-to-compile-for-8974.patch || true
          cd ../../../..
          
          echo ''
          echo '>>> All patches applied!'
          
          export BUILD_USERNAME=crave_gsi
          export BUILD_HOSTNAME=crave
          export WITHOUT_CHECK_API=true
          export WITH_SU=true
          mkdir -p ~/build-output/
          
          buildVariant() {
            echo \"Building variant: \${1}\"
            lunch \${1}-userdebug
            make installclean
            make -j\$(nproc --all) systemimage
            make vndk-test-sepolicy
            mv \$OUT/system.img ~/build-output/lineage-16.0-\$BUILD_DATE-UNOFFICIAL-\${1}.img
            echo \"Completed: \${1}\"
          }
          
          if [ '${{ github.event.inputs.BUILD_VARIANT }}' = 'all' ]; then
            echo '>>> Building ALL variants...'
            buildVariant treble_arm_avN
            buildVariant treble_arm_bvN
            buildVariant treble_a64_avN
            buildVariant treble_a64_bvN
            buildVariant treble_arm64_avN
            buildVariant treble_arm64_bvN
          else
            buildVariant ${{ github.event.inputs.BUILD_VARIANT }}
          fi
          
          echo ''
          echo '============================================'
          echo '>>> Output files:'
          ls -lh ~/build-output/ | grep 'lineage'
          echo '============================================'
          
          END=\$(date +%s)
          ELAPSEDM=\$(((\$END-\$START)/60))
          ELAPSEDS=\$(((\$END-\$START)-\$ELAPSEDM*60))
          echo \"Buildbot completed in \$ELAPSEDM minutes and \$ELAPSEDS seconds\"
          "
        timeout-minutes: 1440

      - name: Telegram Notification - Build Status
        if: ${{ success() || cancelled() || failure() }}
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: ${{ job.status }}
          skipSuccess: false

      - name: Stop Build if Cancelled
        if: ${{ cancelled() }}
        run: |
          cd $PROJECTFOLDER
          crave stop --all

      - name: Upload Build Artifacts to GitHub
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          echo "${{ secrets.GITHUB_TOKEN }}" > token.txt
          crave push token.txt -d $(crave ssh -- pwd | grep -v Select | sed -s 's/\r//g')/
          NOW=$(date '+%Y%m%d')
          crave ssh -- "export GH_UPLOAD_LIMIT="${{ secrets.GH_UPLOAD_LIMIT }}"; bash /opt/crave/github-actions/upload.sh '${{ github.run_id }}' 'LineageOS 16.0 GSI $NOW' '${{ github.repository }}' '${{ github.run_id }}' '${{ secrets.EXTRA_FILES }}'"

      - name: Display Error Log if Build Failed
        if: ${{ failure() }}
        run: |
          cd $PROJECTFOLDER
          crave ssh -- sleep 1
          crave pull out/error.log 2>/dev/null || echo "No error.log found"
          if [ -f out/error.log ]; then
            echo "::group::Build Error Log"
            cat out/error.log
            echo "::endgroup::"
          fi

      - name: Upload to Telegram
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          NOW=$(date '+%Y%m%d')
          crave ssh -- "export TG_UPLOAD_LIMIT="${{ secrets.TG_UPLOAD_LIMIT }}"; bash /opt/crave/telegram/upload.sh 'LineageOS 16.0 GSI $NOW' '${{ secrets.EXTRA_FILES }}'"

      - name: Clean Up Crave Clone
        if: ${{ always() }}
        run: |
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          else
            if [ -d "$PROJECTFOLDER" ]; then
              rm -rf $PROJECTFOLDER
            fi
          fi
