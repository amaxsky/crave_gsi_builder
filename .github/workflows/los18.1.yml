name: LineageOS 18.1 GSI Builder

on:
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: 'Choose GSI variant to build:'
        required: true
        default: '64B'
        type: choice
        options:
          - '32B'
          - '32BO'
          - 'A64B'
          - 'A64BG'
          - 'A64BO'
          - '64B'
          - '64BG'
          - 'all'
      CLEAN_BUILD:
        description: 'Force clean build? (Avoid unless necessary)'
        required: true
        default: 'no'
        type: choice
        options: 
          - 'no'
          - 'yes'

jobs:
  Start-Runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Configure the 'crave' environment
        run: |
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            mkdir ${HOME}/bin/
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          if tmux has-session -t ghactionsokbuddy; then 
            echo 'Runner is already Running' 
          else 
            tmux kill-session -t ghactionsokbuddy 2>/dev/null || true
            tmux new-session -d -s ghactionsokbuddy 
            tmux send-keys -t ghactionsokbuddy './actions-runner-okbuddy/run.sh' Enter 
            echo 'Runner Started'
          fi
          "

  build:
    name: Build LineageOS 18.1 GSI
    needs: Start-Runner
    timeout-minutes: 1440
    runs-on: self-hosted
    concurrency:
      group: ${{ github.actor }}
    
    steps:
      - name: Display Build Info
        run: |
          echo "::group::Build Configuration"
          echo "Build Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          echo "Clean Build: ${{ github.event.inputs.CLEAN_BUILD }}"
          echo "Strategy: Git clone custom files + skip failed patches"
          echo "::endgroup::"

      - name: Telegram Notification - Build Started
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: "Build Started - LineageOS 18.1 GSI - Variant: ${{ github.event.inputs.BUILD_VARIANT }}"
          skipSuccess: false

      - name: Cleanup Workspace
        run: |
          find . -maxdepth 1 -type f -delete 2>/dev/null || true
          find . -maxdepth 1 -type l -delete 2>/dev/null || true

      - name: Setup Project Directory
        run: |
          PROJECTFOLDER="/crave-devspaces/Lineage18"
          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_ENV"
          
          if [ "${DCDEVSPACE}" != "1" ]; then
            echo "Symlinking devspace folder"
            mkdir -p devspace
            sudo mkdir -p /crave-devspaces
            sudo ln -sf ${PWD}/devspace /crave-devspaces
            sudo chmod 777 /crave-devspaces
          else
            echo "We are already running in devspace... Skipping Symlinks"
          fi
          
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            echo "Destroying existing clone..."
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          fi

          if [ "${DCDEVSPACE}" == "1" ]; then
            crave clone create --projectID 85 $PROJECTFOLDER || echo "Crave clone create failed!"
          else
            mkdir -p $PROJECTFOLDER
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure Crave Environment
        run: |
          cd $PROJECTFOLDER
          mkdir -p .repo/manifests
          
          if [ "${DCDEVSPACE}" == "1" ]; then
            echo 'No need to set up crave, we are already running in devspace!'
          else
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv ${PWD}/crave ${HOME}/bin/
            sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
            envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
            rm -rf ${PWD}/crave.conf.sample
            cp crave.conf ./
          fi
          
          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then
            cp ${GITHUB_WORKSPACE}/configs/crave/crave.yaml.aosp .repo/manifests/crave.yaml 2>/dev/null || echo "No template found, using default"
            echo "No Custom Configuration Found, Using Template!"
          else
            echo "${{ secrets.CUSTOM_YAML }}" > .repo/manifests/crave.yaml
            echo "Custom Configuration Found!"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Build LineageOS 18.1 GSI
        run: |
          cd $PROJECTFOLDER
          
          jq '.projects = []' ~/crave.conf > tmp && mv tmp ~/crave.conf
          
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.CLEAN_BUILD }}" == "yes" ]; then
            CLEAN_FLAG="--clean"
          fi

          if [ "${{ github.event.inputs.BUILD_VARIANT }}" == "all" ]; then
            BUILD_TARGETS="32B 32BO A64B A64BG A64BO 64B 64BG"
          else
            BUILD_TARGETS="${{ github.event.inputs.BUILD_VARIANT }}"
          fi

          crave run --no-patch $CLEAN_FLAG "
          echo '============================================'
          echo 'LineageOS 18.1 Treble Buildbot'
          echo 'Strategy: Git clone custom files + skip failed patches'
          echo 'Building variant(s): ${BUILD_TARGETS}'
          echo '============================================'
          echo ''

          echo '>>> Installing real libncurses5 and libtinfo5 (Ubuntu 20.04 binaries)...'
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq wget 2>/dev/null || true

          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb -O /tmp/libtinfo5.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb -O /tmp/libncurses5.deb

          sudo dpkg --force-depends -i /tmp/libtinfo5.deb /tmp/libncurses5.deb 2>/dev/null || {
            echo 'dpkg failed, extracting manually...'
            dpkg-deb -x /tmp/libtinfo5.deb /tmp/libtinfo5_extract
            dpkg-deb -x /tmp/libncurses5.deb /tmp/libncurses5_extract
            sudo cp /tmp/libtinfo5_extract/usr/lib/x86_64-linux-gnu/libtinfo.so.5* /usr/lib/x86_64-linux-gnu/
            sudo cp /tmp/libtinfo5_extract/lib/x86_64-linux-gnu/libtinfo.so.5* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
            sudo cp /tmp/libncurses5_extract/usr/lib/x86_64-linux-gnu/libncurses.so.5* /usr/lib/x86_64-linux-gnu/
            sudo cp /tmp/libncurses5_extract/lib/x86_64-linux-gnu/libncurses.so.5* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
          }

          if [ -f /usr/lib/x86_64-linux-gnu/libncurses.so.5 ]; then
            echo 'libncurses.so.5 installed successfully'
          else
            echo 'ERROR: libncurses.so.5 still missing!'
          fi

          rm -f /tmp/libtinfo5.deb /tmp/libncurses5.deb
          echo 'Dependency fix complete'

          echo ''
          echo '>>> Cloning treble_experimentations...'
          rm -rf ~/treble_experimentations 2>/dev/null || true
          git clone https://github.com/AndyCGYan/treble_experimentations ~/treble_experimentations

          echo '>>> Initializing LineageOS 18.1 repository...'
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1

          echo ''
          echo '>>> Cloning lineage_build_unified...'
          rm -rf lineage_build_unified 2>/dev/null || true
          git clone https://github.com/AndyCGYan/lineage_build_unified lineage_build_unified -b lineage-18.1

          echo '>>> Cloning custom files from amaxsky/los18.1gsi...'
          rm -rf /tmp/los18gsi 2>/dev/null || true
          git clone --depth=1 https://github.com/amaxsky/los18.1gsi.git /tmp/los18gsi

          echo '>>> Copying buildbot_unified.sh...'
          cp /tmp/los18gsi/buildbot_unified.sh lineage_build_unified/buildbot_unified.sh
          chmod +x lineage_build_unified/buildbot_unified.sh
          echo 'buildbot_unified.sh copied'

          echo '>>> Copying TouchInputMapper.cpp...'
          mkdir -p frameworks/native/services/inputflinger/reader/mapper/
          cp /tmp/los18gsi/TouchInputMapper.cpp frameworks/native/services/inputflinger/reader/mapper/TouchInputMapper.cpp
          echo 'TouchInputMapper.cpp copied'

          rm -rf /tmp/los18gsi

          echo '>>> Verifying files...'
          ls -la lineage_build_unified/buildbot_unified.sh
          wc -l lineage_build_unified/buildbot_unified.sh
          head -3 lineage_build_unified/buildbot_unified.sh
          ls -la frameworks/native/services/inputflinger/reader/mapper/

          echo '>>> Cloning lineage_patches_unified (fresh)...'
          rm -rf lineage_patches_unified 2>/dev/null || true
          git clone https://github.com/AndyCGYan/lineage_patches_unified lineage_patches_unified -b lineage-18.1

          echo ''
          echo '>>> Making apply_patches.sh fault-tolerant...'
          sed -i 's/^set -e/set +e/' lineage_build_unified/apply_patches.sh
          sed -i 's/exit 1/echo \"  -> Skipping failed patch, continuing...\"/' lineage_build_unified/apply_patches.sh
          echo 'Done - failed patches will be skipped'

          echo ''
          export BUILD_USERNAME=crave_gsi
          export BUILD_HOSTNAME=crave

          echo '>>> Running build script...'
          bash lineage_build_unified/buildbot_unified.sh treble ${BUILD_TARGETS}
          BUILD_EXIT_CODE=\$?

          echo ''
          echo '============================================'
          echo '>>> Checking for generated images...'
          echo '============================================'
          if ls ~/build-output/lineage-*.img 2>/dev/null; then
            IMG_COUNT=\$(ls ~/build-output/lineage-*.img 2>/dev/null | wc -l)
            echo \"Found \${IMG_COUNT} GSI image(s)\"
            for img in ~/build-output/lineage-*.img; do
              echo \"  \$(basename \$img) - \$(du -h \$img | cut -f1)\"
            done
            echo ''
            echo '>>> Copying images to out/target/product/64B/ for upload...'
            mkdir -p out/target/product/64B/
            cp ~/build-output/lineage-*.img out/target/product/64B/ 2>/dev/null || true
            cp ~/build-output/lineage-*.zip out/target/product/64B/ 2>/dev/null || true
            echo 'Images copied successfully'
          else
            echo 'WARNING: No GSI images found in ~/build-output/'
            echo 'Contents of ~/build-output/:'
            ls -la ~/build-output/ 2>/dev/null || echo '(directory empty or missing)'
          fi

          echo ''
          echo '============================================'
          echo 'Build completed with exit code: '\$BUILD_EXIT_CODE
          echo '============================================'
          exit \$BUILD_EXIT_CODE
          "
        timeout-minutes: 1440

      - name: Copy artifacts to out/target/product/64B/ for upload
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          crave ssh -- "
          if ls ~/build-output/lineage-*.img 2>/dev/null; then
            mkdir -p /tmp/src/android/out/target/product/64B/
            cp ~/build-output/lineage-*.img /tmp/src/android/out/target/product/64B/ 2>/dev/null || true
            cp ~/build-output/lineage-*.zip /tmp/src/android/out/target/product/64B/ 2>/dev/null || true
            echo 'Artifacts copied to out/target/product/64B/'
            ls -la /tmp/src/android/out/target/product/64B/lineage-*
          else
            echo 'No artifacts found in ~/build-output/'
          fi
          "

      - name: Telegram Notification - Build Status
        if: ${{ success() || cancelled() || failure() }}
        continue-on-error: true
        uses: xinthink/action-telegram@v1.1
        with:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: ${{ job.status }}
          skipSuccess: false

      - name: Stop Build if Cancelled
        if: ${{ cancelled() }}
        run: |
          cd $PROJECTFOLDER
          crave stop --all

      - name: Upload Build Artifacts to GitHub
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          echo "${{ secrets.GITHUB_TOKEN }}" > token.txt
          crave push token.txt -d $(crave ssh -- pwd | grep -v Select | sed -s 's/\r//g')/
          crave ssh -- "export GH_UPLOAD_LIMIT="${{ secrets.GH_UPLOAD_LIMIT }}"; bash /opt/crave/github-actions/upload.sh '${{ github.run_id }}' '64B' '${{ github.repository }}' 'LineageOS18.1-${{ github.run_id }}' '${{ secrets.EXTRA_FILES }}'"

      - name: Display Error Log if Build Failed
        if: ${{ failure() }}
        run: |
          cd $PROJECTFOLDER
          crave ssh -- sleep 1
          crave pull out/error.log 2>/dev/null || echo "No error.log found"
          if [ -f out/error.log ]; then
            echo "::group::Build Error Log"
            cat out/error.log
            echo "::endgroup::"
          fi

      - name: Upload to Telegram
        continue-on-error: true
        run: |
          cd $PROJECTFOLDER
          NOW=$(date '+%Y%m%d')
          crave ssh -- "export TG_UPLOAD_LIMIT="${{ secrets.TG_UPLOAD_LIMIT }}"; bash /opt/crave/telegram/upload.sh 'LineageOS 18.1 GSI $NOW' '${{ secrets.EXTRA_FILES }}'"

      - name: Clean Up Crave Clone
        if: ${{ always() }}
        run: |
          if grep -q "$PROJECTFOLDER" <(crave clone list --json | jq -r '.clones[]."Cloned At"') 2>/dev/null && [ "${DCDEVSPACE}" == "1" ]; then
            crave clone destroy -y $PROJECTFOLDER || echo "Error removing $PROJECTFOLDER"
          else
            if [ -d "$PROJECTFOLDER" ]; then
              rm -rf $PROJECTFOLDER
            fi
          fi
