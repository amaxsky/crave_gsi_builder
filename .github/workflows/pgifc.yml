name: Pull GSI Image from Crave

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure crave
        run: |
          mkdir -p ${HOME}/bin/
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ${PWD}/crave ${HOME}/bin/
          sudo ln -sf /home/${USER}/bin/crave /usr/bin/crave
          envsubst < ${PWD}/crave.conf.sample >> ${PWD}/crave.conf
          rm -rf ${PWD}/crave.conf.sample
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Find devspace project
        run: |
          crave clone list --json | jq '.clones[] | {name: ."Project Name", id: ."Project Id", path: ."Cloned At"}'

      - name: Pull image via crave ssh
        run: |
          crave ssh -- "cat ~/build-output/lineage-18.1-*.img" > lineage-18.1.img

      - name: Display pulled file
        run: |
          ls -la lineage-18.1.img

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: lineage-18.1.img
          tag_name: gsi-${{ github.run_id }}
          name: "LineageOS 18.1 GSI - ${{ github.run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
